<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Toolbox — Professional robotics engineering tools: rotation converter, PID tuner, DH calculator, unit converter, trajectory generator and more.">
  <meta name="keywords" content="robotics, engineering, tools, kinematics, dynamics, control, navigation, rotation, quaternion, PID, DH parameters">
  <meta name="author" content="Robot Toolbox">
  <meta name="theme-color" content="#5865f2">
  <meta property="og:title" content="Robot Toolbox">
  <meta property="og:description" content="Professional robotics engineering tools — rotation converter, PID tuner, DH calculator, trajectory generator and more">
  <meta property="og:type" content="website">
  <title>Robot Toolbox</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/tools.css">
</head>
<body>
  <div id="app" class="app">

    <!-- HEADER -->
    <header id="header" class="header">
      <div class="header-left">
        <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar (⌘B)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <a href="#/home" class="logo" onclick="Router.navigate('home');return false;">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="var(--accent)"/>
            <path d="M8 16L13 11L18 16L13 21Z" fill="white" opacity="0.9"/>
            <path d="M14 16L19 11L24 16L19 21Z" fill="white" opacity="0.6"/>
          </svg>
          <span class="logo-text">Robot Toolbox</span>
        </a>
      </div>

      <div class="header-center">
        <button id="search-trigger" class="search-trigger" aria-label="Search tools">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <span data-i18n="search.placeholder">Search tools...</span>
          <kbd>⌘K</kbd>
        </button>
      </div>

      <div class="header-right">
        <div class="header-actions">
          <select id="lang-selector" class="lang-selector" aria-label="Language" title="Language">
            <option value="en">EN</option>
            <option value="pt">PT</option>
            <option value="es">ES</option>
          </select>
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark mode">
            <svg class="sun-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="moon-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings (⌘,)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="main-layout">
      <aside id="sidebar" class="sidebar" role="navigation" aria-label="Tool navigation">
        <nav class="sidebar-nav"></nav>
      </aside>
      <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
      <main id="content" class="content" role="main" aria-live="polite"></main>
    </div>
  </div>

  <!-- SEARCH MODAL -->
  <div id="search-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Search tools" aria-hidden="true">
    <div class="search-modal">
      <div class="search-input-wrapper">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="search-input" class="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search tools..." autocomplete="off" spellcheck="false" aria-label="Search tools">
        <kbd>Esc</kbd>
      </div>
      <div id="search-results" class="search-results" role="listbox"></div>
      <div class="search-footer">
        <span><kbd>↑↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Open</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="settings.title">Settings</h2>
        <button class="icon-btn modal-close" aria-label="Close" data-modal="settings-modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="settings-body"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- LIBRARIES (local, no internet required) -->
  <script src="assets/js/vendor/chart.min.js"></script>
  <script>
    /* Minimal Chart.js defaults applied immediately */
    if (typeof Chart !== 'undefined') {
      Chart.defaults.font.size = 11;
      Chart.defaults.plugins.legend.labels.font = { size: 11 };
    }
  </script>

  <!-- LOCALES -->
  <script src="assets/locales/en.js"></script>
  <script src="assets/locales/pt.js"></script>
  <script src="assets/locales/es.js"></script>

  <!-- CORE -->
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/keyboard.js"></script>

  <!-- ROUTER (must come before tools so Router.register() is available) -->
  <script src="assets/js/router.js"></script>

  <!-- COMPONENTS -->
  <script src="assets/components/sidebar.js"></script>
  <script src="assets/components/modals.js"></script>

  <!-- TOOLS -->
  <script src="assets/tools/home.js"></script>
  <script src="assets/tools/rotation-converter.js"></script>
  <script src="assets/tools/quaternion-toolbox.js"></script>
  <script src="assets/tools/rotation-matrix.js"></script>
  <script src="assets/tools/dh-calculator.js"></script>
  <script src="assets/tools/pid-tuner.js"></script>
  <script src="assets/tools/differential-drive.js"></script>
  <script src="assets/tools/ackermann.js"></script>
  <script src="assets/tools/mecanum.js"></script>
  <script src="assets/tools/skid-steer.js"></script>
  <script src="assets/tools/unit-converter.js"></script>
  <script src="assets/tools/matrix-calculator.js"></script>
  <script src="assets/tools/covariance-visualizer.js"></script>
  <script src="assets/tools/coordinate-frame.js"></script>
  <script src="assets/tools/imu-noise.js"></script>
  <script src="assets/tools/camera-fov.js"></script>
  <script src="assets/tools/trajectory-generator.js"></script>
  <script src="assets/tools/motion-profile.js"></script>

  <!-- APP (must come last) -->
  <script src="assets/js/app.js"></script>
</body>
</html>
